
name: test:sdk-version

on:
  push:
    paths:
    - 'action.yml'
    - '.github/workflows/sdk-version.yml'
  workflow_dispatch:

jobs:
  test-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

        # Last patch of every minor release, see https://sdk.play.date/changelog/
        # 1.9.0 to 1.9.2 are Linux/Windows only, 2.0.2 and 3.0.4 were never released
        version: [
          '1.9.3', '1.10.0', '1.11.1', '1.12.3', '1.13.6',
          '2.0.3', '2.1.1', '2.2.0', '2.3.1', '2.4.2', '2.5.0', '2.6.2', '2.7.6',
          '3.0.6', '3.1.1',
          'latest'
        ]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v2
    - uses: idleberg/setup-playdate-sdk@main
      with:
        sdk_version: ${{ matrix.version }}

    - name: Test version match
      run: |
        if pdc --version | grep -q ${{ matrix.version }}; then
          exit 0
        fi

        if [ "${{ matrix.version }}" = "latest" ]; then
          exit 0
        fi

        echo "Version mismatch"
        exit 1
